name: CI Pipeline

on:
  push:
    branches: [ "main", "feature/ci-linting", "feature/automated-tests" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run HTML Hint
        run: npm run lint:html

      - name: Run Stylelint
        run: npm run lint:css

      - name: Run ESLint
        run: npm run lint:js

      - name: Run Automated Tests
        run: npm test