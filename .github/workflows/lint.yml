name: Linting CI

on:
  push:
    branches: [ "main", "feature/ci-linting" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run HTML Hint
        run: npm run lint:html || true

      - name: Run Stylelint
        run: npm run lint:css || true

      - name: Run ESLint
        run: npm run lint:js || true
